<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Travel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--ink:#070a18;--surface:#0f1530;--surface2:#161d3d;--surface3:#1d2650;--hairline:rgba(232,196,118,0.14);--divider:rgba(245,241,230,0.08);--gold:#d9b46a;--gold-soft:rgba(217,180,106,0.16);--text:#f5f1e6;--muted:rgba(245,241,230,0.62);--dim:rgba(245,241,230,0.42);--good:#7fcf9a;--warn:#f0b46c;--bad:#e98477;--serif:"DM Serif Display",Georgia,serif;--sans:"Manrope",system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;}
h1,h2,h3{font-family:var(--serif);font-weight:400;}
button,select,input,textarea{font-family:var(--sans);}
*::-webkit-scrollbar{width:6px;}*::-webkit-scrollbar-thumb{background:rgba(245,241,230,0.12);border-radius:4px;}
.nav{border-bottom:1px solid var(--divider);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--ink);z-index:100;}
.logo{font-family:var(--serif);font-size:22px;color:var(--gold);}
.btn{padding:8px 18px;background:var(--gold);color:#070a18;border-radius:8px;font-weight:700;font-size:13px;border:none;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
.btn:hover{opacity:.85;}.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--hairline);}
.btn-ghost:hover{color:var(--text);border-color:var(--muted);}
.btn-danger{background:var(--bad);color:#fff;}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:6px;}
.view{display:none;}.view.active{display:block;}
.main{max-width:1200px;margin:0 auto;padding:48px 32px;}
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px;}
.page-title{font-size:40px;}.page-sub{color:var(--muted);font-size:14px;margin-top:4px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;position:relative;}
.card:hover{transform:translateY(-2px);border-color:var(--gold);}
.card-cover{height:170px;background:linear-gradient(135deg,#0a1430 0%,#1e2c5e 40%,#7a5a25 100%);background-size:cover;background-position:center;}
.card-body{padding:18px 22px;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.card-title{font-size:17px;font-weight:600;}
.card-dest{color:var(--gold);font-size:13px;margin-bottom:10px;}
.card-meta{display:flex;gap:14px;color:var(--muted);font-size:12px;flex-wrap:wrap;}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;background:var(--surface2);border-radius:6px;flex-shrink:0;}
.del-card{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:rgba(7,10,24,.85);border:1px solid var(--bad);color:var(--bad);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s;z-index:2;}
.card:hover .del-card{opacity:1;}.del-card:hover{background:var(--bad);color:#fff;}
.empty{text-align:center;padding:80px 0;grid-column:1/-1;}
.empty p{color:var(--muted);font-size:18px;margin-bottom:24px;}
.hero{height:290px;position:relative;background:linear-gradient(135deg,#0a1430 0%,#1e2c5e 40%,#7a5a25 100%);background-size:cover;background-position:center;}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,10,24,.95) 0%,transparent 60%);}
.hero-content{position:absolute;bottom:28px;left:32px;right:32px;}
.hero-title{font-size:38px;margin-bottom:6px;}
.hero-sub{color:var(--muted);margin-bottom:10px;font-size:14px;}
.hero-meta{display:flex;gap:20px;font-size:13px;color:var(--muted);flex-wrap:wrap;}
.hero-meta .dest{color:var(--gold);}
.stats-row{display:flex;gap:16px;margin-bottom:36px;flex-wrap:wrap;}
.stat{background:var(--surface);border:1px solid var(--hairline);border-radius:12px;padding:14px 22px;flex:1 1 110px;}
.stat-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
.stat-value{font-size:22px;font-family:var(--serif);color:var(--gold);}
.notes-box{background:var(--surface);border:1px solid var(--hairline);border-radius:12px;padding:18px 22px;margin-bottom:32px;}
.notes-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.notes-text{color:var(--muted);line-height:1.6;font-size:14px;}
.itin-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.itin{display:flex;flex-direction:column;gap:20px;}
.day-wrap{background:var(--surface);border:1px solid var(--hairline);border-radius:14px;overflow:hidden;}
.day-header{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--divider);}
.day-num{width:36px;height:36px;border-radius:8px;background:var(--gold-soft);border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--gold);font-size:17px;flex-shrink:0;}
.day-info{flex:1;}.day-info p{font-weight:600;font-size:14px;margin-bottom:2px;}.day-info span{color:var(--muted);font-size:12px;}
.day-actions{display:flex;gap:8px;margin-left:auto;flex-shrink:0;}
.acts{padding:12px 16px;display:flex;flex-direction:column;gap:10px;}
.act{background:var(--surface2);border:1px solid var(--hairline);border-radius:10px;padding:12px 16px;display:flex;gap:12px;position:relative;}
.act-icon{width:30px;height:30px;border-radius:7px;background:var(--surface3);display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0;}
.act-body{flex:1;min-width:0;}
.act-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px;}
.act-title{font-weight:600;font-size:13px;}
.act-time{color:var(--gold);font-size:12px;font-family:monospace;flex-shrink:0;}
.act-sub{color:var(--muted);font-size:12px;margin-bottom:3px;}
.act-brief{color:var(--dim);font-size:11px;margin-bottom:6px;}
.act-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.act-loc{color:var(--muted);font-size:11px;}
.tag{font-size:10px;padding:2px 6px;background:var(--surface3);border-radius:4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.del-act{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:4px;opacity:0;transition:opacity .15s;line-height:1;}
.act:hover .del-act{opacity:1;}.del-act:hover{color:var(--bad);}
.no-acts{color:var(--dim);font-size:13px;padding:4px 0;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(7,10,24,.8);z-index:200;align-items:center;justify-content:center;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
.modal-hdr{padding:22px 26px 0;display:flex;align-items:center;justify-content:space-between;}
.modal-hdr h2{font-size:22px;}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:4px;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:18px 26px 26px;}
.fields{display:flex;flex-direction:column;gap:16px;}
.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em;}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;background:var(--surface2);border:1px solid var(--hairline);border-radius:9px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);}
.field textarea{min-height:70px;resize:vertical;}
.field select option{background:var(--surface2);}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.col21{display:grid;grid-template-columns:2fr 1fr;gap:14px;}
.form-actions{display:flex;gap:10px;margin-top:4px;}
.form-actions .btn{flex:2;padding:12px 0;font-size:14px;}
.form-actions .btn-ghost{flex:1;padding:12px 0;font-size:14px;}
.err{color:var(--bad);font-size:12px;}
.back-btn{color:var(--muted);font-size:13px;cursor:pointer;background:none;border:none;}
.back-btn:hover{color:var(--text);}
.loading{display:flex;align-items:center;justify-content:center;padding:80px;color:var(--muted);}
.no-days{padding:24px;color:var(--muted);font-size:14px;text-align:center;}
.form-page{max-width:620px;margin:0 auto;padding:48px 32px;}
.form-title{font-size:36px;margin-bottom:8px;}.form-sub{color:var(--muted);margin-bottom:32px;font-size:14px;}
@keyframes fade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.fade{animation:fade .35s cubic-bezier(.2,.7,.3,1) both;}
</style>
</head>
<body>

<nav class="nav">
  <span class="logo">Go Travel</span>
  <div style="display:flex;gap:10px;align-items:center;">
    <button class="back-btn" id="backBtn" style="display:none" onclick="showDashboard()">← All Trips</button>
    <button class="btn" id="navActionBtn" onclick="showCreate()">+ New Trip</button>
  </div>
</nav>

<!-- DASHBOARD -->
<div class="view active" id="viewDashboard">
  <div class="main">
    <div class="page-hdr">
      <div><h1 class="page-title">My Trips</h1><p class="page-sub" id="tripCount">Loading…</p></div>
    </div>
    <div id="tripGrid" class="grid"></div>
  </div>
</div>

<!-- DETAIL -->
<div class="view" id="viewDetail">
  <div id="heroArea"></div>
  <div class="main">
    <div class="stats-row" id="statsRow"></div>
    <div id="notesArea"></div>
    <div class="itin-hdr">
      <h2 style="font-size:26px;">Itinerary</h2>
      <button class="btn btn-sm" onclick="openAddDay()">+ Add Day</button>
    </div>
    <div class="itin" id="itinArea"></div>
  </div>
</div>

<!-- CREATE TRIP -->
<div class="view" id="viewCreate">
  <div class="form-page">
    <h1 class="form-title">Plan a new trip</h1>
    <p class="form-sub">Fill in the basics — add itinerary days after creating.</p>
    <div class="fields">
      <div class="field"><label>Trip name *</label><input id="fName" placeholder="e.g. Tokyo Winter 2026"></div>
      <div class="field"><label>Subtitle</label><input id="fSub" placeholder="e.g. 10 days of ramen &amp; temples"></div>
      <div class="field"><label>Destination *</label><input id="fDest" placeholder="e.g. Tokyo, Japan"></div>
      <div class="col2">
        <div class="field"><label>Start date *</label><input type="date" id="fStart"></div>
        <div class="field"><label>End date *</label><input type="date" id="fEnd"></div>
      </div>
      <div class="col2">
        <div class="field"><label>Travelers</label><input type="number" id="fTravelers" value="1" min="1"></div>
        <div class="field"><label>Status</label>
          <select id="fStatus"><option value="draft">Draft</option><option value="planning">Planning</option><option value="confirmed">Confirmed</option><option value="idea">Idea</option></select>
        </div>
      </div>
      <div class="col21">
        <div class="field"><label>Budget</label><input type="number" id="fBudget" placeholder="0"></div>
        <div class="field"><label>Currency</label><input id="fCurrency" value="USD"></div>
      </div>
      <div class="field"><label>Cover image URL</label><input id="fCover" placeholder="https://…"></div>
      <div class="field"><label>Notes</label><textarea id="fNotes" placeholder="Tips, reminders, packing list…"></textarea></div>
      <p class="err" id="formErr"></p>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="showDashboard()">Cancel</button>
        <button class="btn" id="submitBtn" onclick="createTrip()">Create Trip</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: Add Day -->
<div class="modal-bg" id="modalDay">
  <div class="modal">
    <div class="modal-hdr"><h2>Add Day</h2><button class="modal-close" onclick="closeModal('modalDay')">✕</button></div>
    <div class="modal-body">
      <div class="fields">
        <div class="col2">
          <div class="field"><label>Day number *</label><input type="number" id="dIndex" min="1" value="1"></div>
          <div class="field"><label>Date *</label><input type="date" id="dDate"></div>
        </div>
        <div class="field"><label>Title</label><input id="dTitle" placeholder="e.g. Arrival · City Centre"></div>
        <p class="err" id="dayErr"></p>
        <div class="form-actions">
          <button class="btn btn-ghost" onclick="closeModal('modalDay')">Cancel</button>
          <button class="btn" onclick="addDay()">Add Day</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: Add Activity -->
<div class="modal-bg" id="modalAct">
  <div class="modal">
    <div class="modal-hdr"><h2>Add Activity</h2><button class="modal-close" onclick="closeModal('modalAct')">✕</button></div>
    <div class="modal-body">
      <div class="fields">
        <div class="col2">
          <div class="field"><label>Title *</label><input id="aTitle" placeholder="e.g. Dinner at Nobu"></div>
          <div class="field"><label>Time</label><input id="aTime" placeholder="19:30"></div>
        </div>
        <div class="field"><label>Subtitle</label><input id="aSub" placeholder="e.g. Japanese omakase"></div>
        <div class="field"><label>Location</label><input id="aLoc" placeholder="e.g. 1 Park Ave, Level 4"></div>
        <div class="field"><label>Transport</label><input id="aTrans" placeholder="e.g. Taxi · 12 min"></div>
        <div class="field"><label>Notes / Brief</label><textarea id="aBrief" placeholder="Tips, booking info…" style="min-height:60px"></textarea></div>
        <div class="col2">
          <div class="field"><label>Icon</label>
            <select id="aIcon">
              <option value="pin">📍 General</option><option value="plane">✈️ Transport</option>
              <option value="bed">🛏 Stay</option><option value="food">🍽 Food</option>
              <option value="drink">🍹 Drink</option><option value="museum">🏛 Culture</option>
              <option value="metro">🚇 Metro</option><option value="camera">📷 Photo</option>
              <option value="sparkle">✨ Activity</option><option value="walk">🚶 Walk</option>
            </select>
          </div>
          <div class="field"><label>Tags (comma sep)</label><input id="aTags" placeholder="Food, Culture"></div>
        </div>
        <p class="err" id="actErr"></p>
        <div class="form-actions">
          <button class="btn btn-ghost" onclick="closeModal('modalAct')">Cancel</button>
          <button class="btn" onclick="addActivity()">Add Activity</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL='https://gcasybvvlddpcxrhoguy.supabase.co'
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjYXN5YnZ2bGRkcGN4cmhvZ3V5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MjEyMTUsImV4cCI6MjA5Mzk5NzIxNX0.I0njIoSFvO5XPZEzZPcH6khUzmvceC-8vdu6H9kA7E0'
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)

const STATUS_COLOR={idea:'#7f9bb8',draft:'rgba(245,241,230,0.42)',planning:'#f0b46c',confirmed:'#7fcf9a',completed:'#d9b46a',archived:'rgba(245,241,230,0.42)'}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
const ICONS={plane:'M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5L21 16Z',bed:'M3 18v-7a2 2 0 0 1 2-2h7v9M21 18v-4a2 2 0 0 0-2-2H12M3 18h18M7 9V7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2',food:'M7 3v8m0 0a2 2 0 1 0 4 0V3m6 0v18M14 3c1.5 0 3 1 3 3v6h-3V3Z',museum:'M4 21h16M5 21V10m14 11V10M3 10l9-6 9 6M8 21v-7m4 7v-7m4 7v-7',drink:'M5 4h14l-2 8a5 5 0 0 1-10 0L5 4Zm7 13v4m-4 0h8',metro:'M6 3h12a2 2 0 0 1 2 2v11a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2Zm0 6h12M8 16h.01M16 16h.01M9 22l3-3 3 3',sparkle:'M12 3l2.7 5.5 6 .9-4.4 4.2 1 6L12 16.8 6.7 19.6l1-6L3.3 9.4l6-.9L12 3Z',camera:'M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Zm8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z',walk:'M13 4a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm-2 3-3 4 2 3v6m1-9 3 2 4-1m-7-1 1 4',pin:'M12 21s7-7.5 7-12a7 7 0 1 0-14 0c0 4.5 7 12 7 12Zm0-9.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z'}

function svgIcon(name){const d=ICONS[name]||ICONS.pin;return`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`}

function fmt(s,{weekday,year}={}){if(!s)return '';const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);const dd=String(d).padStart(2,'0');const mmm=MONTHS[m-1];if(weekday)return`${DAYS[dt.getDay()]} · ${dd}/${mmm}/${y}`;if(!year)return`${dd}/${mmm}`;return`${dd}/${mmm}/${y}`}

let currentTripId=null,currentDayId=null

function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active')}

function showDashboard(){
  show('viewDashboard')
  document.getElementById('backBtn').style.display='none'
  const btn=document.getElementById('navActionBtn')
  btn.textContent='+ New Trip';btn.className='btn';btn.onclick=showCreate
  currentTripId=null;loadTrips()
}

function showCreate(){
  show('viewCreate')
  document.getElementById('backBtn').style.display=''
  document.getElementById('navActionBtn').style.display='none'
  document.getElementById('formErr').textContent=''
}

function showDetail(id){
  currentTripId=id;show('viewDetail')
  document.getElementById('backBtn').style.display=''
  const btn=document.getElementById('navActionBtn')
  btn.style.display='';btn.textContent='🗑 Delete Trip'
  btn.className='btn btn-danger btn-sm';btn.onclick=()=>deleteTrip(id)
  loadTrip(id)
}

function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
document.querySelectorAll('.modal-bg').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('open')}))

function openAddDay(){
  document.getElementById('dayErr').textContent=''
  document.getElementById('dTitle').value=''
  document.getElementById('dDate').value=''
  const n=document.querySelectorAll('.day-wrap').length
  document.getElementById('dIndex').value=n+1
  openModal('modalDay')
}

function openAddActivity(dayId){
  currentDayId=dayId
  document.getElementById('actErr').textContent=''
  ;['aTitle','aTime','aSub','aLoc','aTrans','aBrief','aTags'].forEach(id=>document.getElementById(id).value='')
  document.getElementById('aIcon').value='pin'
  openModal('modalAct')
}

// ── DASHBOARD ──────────────────────────────────
async function loadTrips(){
  const grid=document.getElementById('tripGrid'),count=document.getElementById('tripCount')
  grid.innerHTML='<div class="loading">Loading trips…</div>'
  const{data:trips,error}=await sb.from('trips').select('*').order('created_at',{ascending:false})
  if(error){grid.innerHTML=`<p style="color:var(--bad);padding:20px">${error.message}</p>`;return}
  count.textContent=`${trips.length} trip${trips.length!==1?'s':''} planned`
  if(!trips.length){
    grid.innerHTML=`<div class="empty"><p>No trips yet — where will you go?</p><button class="btn" onclick="showCreate()">Plan your first trip</button></div>`
    return
  }
  grid.innerHTML=trips.map(t=>`
    <div class="card fade" onclick="showDetail('${t.id}')">
      <div class="del-card" onclick="event.stopPropagation();deleteTrip('${t.id}')" title="Delete trip">✕</div>
      <div class="card-cover" style="${t.cover_url?`background-image:url(${t.cover_url})`:''}"></div>
      <div class="card-body">
        <div class="card-top"><div class="card-title">${t.name}</div><span class="badge" style="color:${STATUS_COLOR[t.status]||'var(--muted)'}">${t.status}</span></div>
        <div class="card-dest">📍 ${t.destination}</div>
        <div class="card-meta">
          <span>📅 ${fmt(t.start_date)} – ${fmt(t.end_date,{year:true})}</span>
          <span>👥 ${t.travelers}</span>
          ${t.budget_total?`<span>💰 ${t.budget_currency} ${Number(t.budget_total).toLocaleString()}</span>`:''}
        </div>
      </div>
    </div>`).join('')
}

// ── DELETE TRIP ─────────────────────────────────
async function deleteTrip(id){
  if(!confirm('Delete this trip and all its itinerary? This cannot be undone.'))return
  const{error}=await sb.from('trips').delete().eq('id',id)
  if(error){alert('Error: '+error.message);return}
  showDashboard()
}

// ── TRIP DETAIL ─────────────────────────────────
async function loadTrip(id){
  document.getElementById('heroArea').innerHTML='<div class="loading">Loading…</div>'
  document.getElementById('itinArea').innerHTML=''
  document.getElementById('statsRow').innerHTML=''
  document.getElementById('notesArea').innerHTML=''
  const[{data:trip},{data:days}]=await Promise.all([
    sb.from('trips').select('*').eq('id',id).single(),
    sb.from('itinerary_days').select('*, activities(*)').eq('trip_id',id).order('day_index')
  ])
  if(!trip){document.getElementById('heroArea').innerHTML='<p style="color:var(--bad);padding:40px">Trip not found.</p>';return}
  const dayCount=Math.ceil((new Date(trip.end_date)-new Date(trip.start_date))/86400000)+1
  const actCount=(days||[]).reduce((s,d)=>s+(d.activities?.length||0),0)
  document.getElementById('heroArea').innerHTML=`
    <div class="hero" style="${trip.cover_url?`background-image:url(${trip.cover_url})`:''}">
      <div class="hero-overlay"></div>
      <div class="hero-content fade">
        <h1 class="hero-title">${trip.name}</h1>
        ${trip.subtitle?`<p class="hero-sub">${trip.subtitle}</p>`:''}
        <div class="hero-meta">
          <span class="dest">📍 ${trip.destination}</span>
          <span>📅 ${fmt(trip.start_date)} – ${fmt(trip.end_date,{year:true})}</span>
          <span>👥 ${trip.travelers} traveler${trip.travelers!==1?'s':''}</span>
          ${trip.budget_total?`<span>💰 ${trip.budget_currency} ${Number(trip.budget_total).toLocaleString()}</span>`:''}
        </div>
      </div>
    </div>`
  document.getElementById('statsRow').innerHTML=[
    {label:'Days',value:dayCount},{label:'Activities',value:actCount},
    {label:'Status',value:trip.status.charAt(0).toUpperCase()+trip.status.slice(1)},
  ].map(s=>`<div class="stat fade"><div class="stat-label">${s.label}</div><div class="stat-value">${s.value}</div></div>`).join('')
  if(trip.notes)document.getElementById('notesArea').innerHTML=`<div class="notes-box fade"><div class="notes-label">Notes</div><div class="notes-text">${trip.notes}</div></div>`
  renderItinerary(days||[])
}

function renderItinerary(days){
  const itin=document.getElementById('itinArea')
  if(!days.length){itin.innerHTML='<div class="no-days">No days yet — click <strong>+ Add Day</strong> to build your itinerary.</div>';return}
  itin.innerHTML=days.map(day=>{
    const acts=(day.activities||[]).sort((a,b)=>a.position-b.position)
    return`<div class="day-wrap fade">
      <div class="day-header">
        <div class="day-num">${day.day_index}</div>
        <div class="day-info"><p>${day.title||`Day ${day.day_index}`}</p><span>${fmt(day.date,{weekday:true})}${day.weather?` · ${day.weather.t}`:''}</span></div>
        <div class="day-actions">
          <button class="btn btn-sm" onclick="openAddActivity('${day.id}')">+ Activity</button>
          <button class="btn btn-sm btn-danger" onclick="deleteDay('${day.id}')">Delete</button>
        </div>
      </div>
      <div class="acts">
        ${acts.map(act=>`
          <div class="act">
            <div class="act-icon">${svgIcon(act.icon)}</div>
            <div class="act-body">
              <div class="act-top"><span class="act-title">${act.title}</span>${act.time?`<span class="act-time">${act.time}`:''}</span></div>
              ${act.subtitle?`<div class="act-sub">${act.subtitle}</div>`:''}
              ${act.brief?`<div class="act-brief">${act.brief}</div>`:''}
              <div class="act-foot">
                ${act.location?`<span class="act-loc">📍 ${act.location}</span>`:''}
                ${act.transport?`<span class="act-loc">🚇 ${act.transport}</span>`:''}
                ${(act.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}
              </div>
            </div>
            <button class="del-act" onclick="deleteActivity('${act.id}')" title="Delete">✕</button>
          </div>`).join('')}
        ${!acts.length?'<p class="no-acts">No activities yet — click + Activity to add one.</p>':''}
      </div>
    </div>`
  }).join('')
}

// ── ADD DAY ─────────────────────────────────────
async function addDay(){
  const err=document.getElementById('dayErr')
  const dayIndex=parseInt(document.getElementById('dIndex').value)
  const date=document.getElementById('dDate').value
  const title=document.getElementById('dTitle').value.trim()
  err.textContent=''
  if(!date){err.textContent='Date is required.';return}
  if(!dayIndex||dayIndex<1){err.textContent='Day number must be at least 1.';return}
  const{error}=await sb.from('itinerary_days').insert({trip_id:currentTripId,day_index:dayIndex,date,title:title||null})
  if(error){err.textContent=error.message;return}
  closeModal('modalDay')
  loadTrip(currentTripId)
}

// ── DELETE DAY ───────────────────────────────────
async function deleteDay(dayId){
  if(!confirm('Delete this day and all its activities?'))return
  const{error}=await sb.from('itinerary_days').delete().eq('id',dayId)
  if(error){alert('Error: '+error.message);return}
  loadTrip(currentTripId)
}

// ── ADD ACTIVITY ─────────────────────────────────
async function addActivity(){
  const err=document.getElementById('actErr')
  const title=document.getElementById('aTitle').value.trim()
  err.textContent=''
  if(!title){err.textContent='Title is required.';return}
  const{count}=await sb.from('activities').select('*',{count:'exact',head:true}).eq('day_id',currentDayId)
  const tags=document.getElementById('aTags').value.split(',').map(t=>t.trim()).filter(Boolean)
  const{error}=await sb.from('activities').insert({
    day_id:currentDayId,position:count||0,title,
    time:document.getElementById('aTime').value.trim()||null,
    subtitle:document.getElementById('aSub').value.trim()||null,
    location:document.getElementById('aLoc').value.trim()||null,
    transport:document.getElementById('aTrans').value.trim()||null,
    brief:document.getElementById('aBrief').value.trim()||null,
    icon:document.getElementById('aIcon').value,
    tags:tags.length?tags:null,
  })
  if(error){err.textContent=error.message;return}
  closeModal('modalAct')
  loadTrip(currentTripId)
}

// ── DELETE ACTIVITY ──────────────────────────────
async function deleteActivity(actId){
  if(!confirm('Delete this activity?'))return
  const{error}=await sb.from('activities').delete().eq('id',actId)
  if(error){alert('Error: '+error.message);return}
  loadTrip(currentTripId)
}

// ── CREATE TRIP ──────────────────────────────────
async function createTrip(){
  const btn=document.getElementById('submitBtn'),err=document.getElementById('formErr')
  const name=document.getElementById('fName').value.trim()
  const dest=document.getElementById('fDest').value.trim()
  const start=document.getElementById('fStart').value
  const end=document.getElementById('fEnd').value
  err.textContent=''
  if(!name){err.textContent='Trip name is required.';return}
  if(!dest){err.textContent='Destination is required.';return}
  if(!start||!end){err.textContent='Start and end dates are required.';return}
  if(new Date(end)<new Date(start)){err.textContent='End date must be after start date.';return}
  btn.disabled=true;btn.textContent='Creating…'
  const{data,error}=await sb.from('trips').insert({
    name,destination:dest,
    subtitle:document.getElementById('fSub').value.trim()||null,
    start_date:start,end_date:end,
    status:document.getElementById('fStatus').value,
    budget_total:parseFloat(document.getElementById('fBudget').value)||null,
    budget_currency:document.getElementById('fCurrency').value||'USD',
    travelers:parseInt(document.getElementById('fTravelers').value)||1,
    notes:document.getElementById('fNotes').value.trim()||null,
    cover_url:document.getElementById('fCover').value.trim()||null,
  }).select().single()
  btn.disabled=false;btn.textContent='Create Trip'
  if(error){err.textContent=error.message;return}
  ;['fName','fSub','fDest','fStart','fEnd','fBudget','fNotes','fCover'].forEach(id=>document.getElementById(id).value='')
  document.getElementById('fTravelers').value=1
  document.getElementById('fStatus').value='draft'
  document.getElementById('fCurrency').value='USD'
  showDetail(data.id)
}

loadTrips()
</script>
