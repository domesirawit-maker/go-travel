<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --ink: #070a18; --surface: #0f1530; --surface2: #161d3d; --surface3: #1d2650;
    --hairline: rgba(232,196,118,0.14); --divider: rgba(245,241,230,0.08);
    --gold: #d9b46a; --gold-soft: rgba(217,180,106,0.16); --gold-deep: #9c7d3e;
    --text: #f5f1e6; --muted: rgba(245,241,230,0.62); --dim: rgba(245,241,230,0.42);
    --good: #7fcf9a; --warn: #f0b46c; --bad: #e98477;
    --serif: "DM Serif Display", Georgia, serif;
    --sans: "Manrope", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--ink); color: var(--text); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  h1,h2,h3 { font-family: var(--serif); font-weight: 400; }
  a { color: inherit; text-decoration: none; }
  button,select,input,textarea { font-family: var(--sans); }
  *::-webkit-scrollbar { width: 6px; } *::-webkit-scrollbar-thumb { background: rgba(245,241,230,0.12); border-radius: 4px; }

  /* Nav */
  .nav { border-bottom: 1px solid var(--divider); padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--ink); z-index: 10; }
  .nav-logo { font-family: var(--serif); font-size: 22px; color: var(--gold); }
  .btn { padding: 8px 18px; background: var(--gold); color: #070a18; border-radius: 8px; font-weight: 600; font-size: 13px; border: none; cursor: pointer; transition: opacity .15s; }
  .btn:hover { opacity: .85; } .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: var(--surface2); color: var(--muted); border: 1px solid var(--hairline); }

  /* Views */
  .view { display: none; } .view.active { display: block; }

  /* Dashboard */
  .main { max-width: 1200px; margin: 0 auto; padding: 48px 32px; }
  .page-title { font-size: 40px; margin-bottom: 8px; }
  .page-sub { color: var(--muted); margin-bottom: 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; overflow: hidden; cursor: pointer; transition: transform .15s, border-color .15s; }
  .card:hover { transform: translateY(-2px); border-color: var(--gold); }
  .card-cover { height: 180px; background: linear-gradient(135deg,#0a1430 0%,#1e2c5e 40%,#7a5a25 100%); background-size: cover; background-position: center; }
  .card-body { padding: 20px 24px; }
  .card-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .card-dest { color: var(--gold); font-size: 13px; margin-bottom: 10px; }
  .card-meta { display: flex; gap: 14px; color: var(--muted); font-size: 12px; }
  .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; background: var(--surface2); border-radius: 6px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .empty { text-align: center; padding: 80px 0; }
  .empty p { color: var(--muted); font-size: 18px; margin-bottom: 24px; }

  /* Trip Detail */
  .hero { height: 300px; position: relative; background: linear-gradient(135deg,#0a1430 0%,#1e2c5e 40%,#7a5a25 100%); background-size: cover; background-position: center; }
  .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(7,10,24,.95) 0%, transparent 60%); }
  .hero-content { position: absolute; bottom: 28px; left: 32px; right: 32px; }
  .hero-title { font-size: 40px; margin-bottom: 6px; }
  .hero-sub { color: var(--muted); margin-bottom: 10px; font-size: 14px; }
  .hero-meta { display: flex; gap: 20px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .hero-meta .dest { color: var(--gold); }
  .stats-row { display: flex; gap: 16px; margin-bottom: 40px; flex-wrap: wrap; }
  .stat { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 16px 24px; flex: 1 1 120px; }
  .stat-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .stat-value { font-size: 24px; font-family: var(--serif); color: var(--gold); }
  .notes-box { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 20px 24px; margin-bottom: 36px; }
  .notes-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .notes-text { color: var(--muted); line-height: 1.6; }

  /* Itinerary */
  .itin { display: flex; flex-direction: column; gap: 28px; }
  .day-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .day-num { width: 40px; height: 40px; border-radius: 10px; background: var(--gold-soft); border: 1px solid var(--hairline); display: flex; align-items: center; justify-content: center; font-family: var(--serif); color: var(--gold); font-size: 18px; flex-shrink: 0; }
  .day-info p { font-weight: 600; margin-bottom: 2px; }
  .day-info span { color: var(--muted); font-size: 12px; }
  .acts { margin-left: 54px; display: flex; flex-direction: column; gap: 10px; }
  .act { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 14px 18px; display: flex; gap: 14px; }
  .act-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--gold); flex-shrink: 0; }
  .act-body { flex: 1; min-width: 0; }
  .act-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 2px; }
  .act-title { font-weight: 600; font-size: 14px; }
  .act-time { color: var(--gold); font-size: 12px; font-family: monospace; flex-shrink: 0; }
  .act-sub { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .act-brief { color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  .act-foot { display: flex; gap: 10px; flex-wrap: wrap; }
  .act-loc { color: var(--muted); font-size: 11px; }
  .tag { font-size: 10px; padding: 2px 7px; background: var(--surface2); border-radius: 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  /* Form */
  .form-wrap { max-width: 620px; margin: 0 auto; padding: 48px 32px; }
  .form-title { font-size: 36px; margin-bottom: 8px; }
  .form-sub { color: var(--muted); margin-bottom: 36px; }
  .fields { display: flex; flex-direction: column; gap: 22px; }
  .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 7px; text-transform: uppercase; letter-spacing: .08em; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 14px; background: var(--surface2); border: 1px solid var(--hairline);
    border-radius: 10px; color: var(--text); font-size: 14px; outline: none;
  }
  .field input:focus, .field select, .field textarea:focus { border-color: var(--gold); }
  .field textarea { min-height: 90px; resize: vertical; }
  .field select option { background: var(--surface2); }
  .col2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .col21 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  .form-actions { display: flex; gap: 12px; margin-top: 4px; }
  .form-actions .btn { flex: 2; padding: 13px 0; font-size: 15px; }
  .form-actions .btn-ghost { flex: 1; padding: 13px 0; font-size: 15px; }
  .err { color: var(--bad); font-size: 13px; }

  /* Back link */
  .back { color: var(--muted); font-size: 13px; cursor: pointer; }
  .back:hover { color: var(--text); }

  /* Loading */
  .loading { display: flex; align-items: center; justify-content: center; padding: 80px; color: var(--muted); }

  @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .fade { animation: fade .4s cubic-bezier(.2,.7,.3,1) both; }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <span class="nav-logo">Go Travel</span>
  <div style="display:flex;gap:10px;align-items:center">
    <span class="back" id="backBtn" style="display:none" onclick="showDashboard()">← All Trips</span>
    <button class="btn" id="newTripBtn" onclick="showCreate()">+ New Trip</button>
  </div>
</nav>

<!-- DASHBOARD VIEW -->
<div class="view active" id="viewDashboard">
  <div class="main">
    <h1 class="page-title">My Trips</h1>
    <p class="page-sub" id="tripCount">Loading…</p>
    <div id="tripGrid" class="grid"></div>
  </div>
</div>

<!-- TRIP DETAIL VIEW -->
<div class="view" id="viewDetail">
  <div id="heroArea"></div>
  <div class="main">
    <div class="stats-row" id="statsRow"></div>
    <div id="notesArea"></div>
    <h2 style="font-size:28px;margin-bottom:20px">Itinerary</h2>
    <div class="itin" id="itinArea"></div>
  </div>
</div>

<!-- CREATE VIEW -->
<div class="view" id="viewCreate">
  <div class="form-wrap">
    <h1 class="form-title">Plan a new trip</h1>
    <p class="form-sub">Fill in the basics — you can add itinerary details later.</p>
    <div class="fields">
      <div class="field"><label>Trip name *</label><input id="fName" placeholder="e.g. Tokyo Winter 2026"></div>
      <div class="field"><label>Subtitle</label><input id="fSub" placeholder="e.g. 10 days of ramen and temples"></div>
      <div class="field"><label>Destination *</label><input id="fDest" placeholder="e.g. Tokyo, Japan"></div>
      <div class="col2">
        <div class="field"><label>Start date *</label><input type="date" id="fStart"></div>
        <div class="field"><label>End date *</label><input type="date" id="fEnd"></div>
      </div>
      <div class="col2">
        <div class="field"><label>Travelers</label><input type="number" id="fTravelers" value="1" min="1"></div>
        <div class="field"><label>Status</label>
          <select id="fStatus">
            <option value="draft">Draft</option>
            <option value="planning">Planning</option>
            <option value="confirmed">Confirmed</option>
            <option value="idea">Idea</option>
          </select>
        </div>
      </div>
      <div class="col21">
        <div class="field"><label>Budget</label><input type="number" id="fBudget" placeholder="0"></div>
        <div class="field"><label>Currency</label><input id="fCurrency" value="USD"></div>
      </div>
      <div class="field"><label>Cover image URL</label><input id="fCover" placeholder="https://…"></div>
      <div class="field"><label>Notes</label><textarea id="fNotes" placeholder="Tips, reminders, packing list…"></textarea></div>
      <p class="err" id="formErr"></p>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="showDashboard()">Cancel</button>
        <button class="btn" id="submitBtn" onclick="createTrip()">Create Trip</button>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://gcasybvvlddpcxrhoguy.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjYXN5YnZ2bGRkcGN4cmhvZ3V5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MjEyMTUsImV4cCI6MjA5Mzk5NzIxNX0.I0njIoSFvO5XPZEzZPcH6khUzmvceC-8vdu6H9kA7E0'
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const STATUS_COLOR = { idea:'#7f9bb8', draft:'rgba(245,241,230,0.42)', planning:'#f0b46c', confirmed:'#7fcf9a', completed:'#d9b46a', archived:'rgba(245,241,230,0.42)' }

const ICONS = {
  plane:'M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5L21 16Z',
  bed:'M3 18v-7a2 2 0 0 1 2-2h7v9M21 18v-4a2 2 0 0 0-2-2H12M3 18h18M7 9V7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2',
  food:'M7 3v8m0 0a2 2 0 1 0 4 0V3m6 0v18M14 3c1.5 0 3 1 3 3v6h-3V3Z',
  museum:'M4 21h16M5 21V10m14 11V10M3 10l9-6 9 6M8 21v-7m4 7v-7m4 7v-7',
  drink:'M5 4h14l-2 8a5 5 0 0 1-10 0L5 4Zm7 13v4m-4 0h8',
  metro:'M6 3h12a2 2 0 0 1 2 2v11a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2Zm0 6h12M8 16h.01M16 16h.01M9 22l3-3 3 3',
  sparkle:'M12 3l2.7 5.5 6 .9-4.4 4.2 1 6L12 16.8 6.7 19.6l1-6L3.3 9.4l6-.9L12 3Z',
  camera:'M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Zm8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z',
  walk:'M13 4a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm-2 3-3 4 2 3v6m1-9 3 2 4-1m-7-1 1 4',
  pin:'M12 21s7-7.5 7-12a7 7 0 1 0-14 0c0 4.5 7 12 7 12Zm0-9.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z',
}

function icon(name) {
  const d = ICONS[name] || ICONS.pin
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`
}

function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'))
  document.getElementById(id).classList.add('active')
}

function showDashboard() {
  show('viewDashboard')
  document.getElementById('backBtn').style.display = 'none'
  document.getElementById('newTripBtn').style.display = ''
  loadTrips()
}

function showCreate() {
  show('viewCreate')
  document.getElementById('backBtn').style.display = ''
  document.getElementById('newTripBtn').style.display = 'none'
  document.getElementById('formErr').textContent = ''
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']

function fmt(dateStr, { weekday, year } = {}) {
  if (!dateStr) return ''
  // Parse as local date to avoid UTC offset shifting the day
  const [y, m, d] = dateStr.split('-').map(Number)
  const date = new Date(y, m - 1, d)
  const dd = String(d).padStart(2, '0')
  const mmm = MONTHS[m - 1]
  const yyyy = y
  const base = `${dd}/${mmm}/${yyyy}`
  if (weekday) return `${DAYS[date.getDay()]} · ${base}`
  if (!year) return `${dd}/${mmm}`
  return base
}

// ── DASHBOARD ──────────────────────────────────────────────────────────────
async function loadTrips() {
  const grid = document.getElementById('tripGrid')
  const count = document.getElementById('tripCount')
  grid.innerHTML = '<div class="loading">Loading trips…</div>'

  const { data: trips, error } = await sb.from('trips').select('*').order('created_at', { ascending: false })

  if (error) { grid.innerHTML = `<p style="color:var(--bad)">${error.message}</p>`; return }

  count.textContent = `${trips.length} trip${trips.length !== 1 ? 's' : ''} planned`

  if (!trips.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <p>No trips yet — where will you go?</p>
      <button class="btn" onclick="showCreate()">Plan your first trip</button>
    </div>`
    return
  }

  grid.innerHTML = trips.map(t => `
    <div class="card fade" onclick="loadTrip('${t.id}')">
      <div class="card-cover" style="${t.cover_url ? `background-image:url(${t.cover_url})` : ''}"></div>
      <div class="card-body">
        <div class="card-top">
          <div class="card-title">${t.name}</div>
          <span class="badge" style="color:${STATUS_COLOR[t.status]||'var(--muted)'}">${t.status}</span>
        </div>
        <div class="card-dest">📍 ${t.destination}</div>
        <div class="card-meta">
          <span>📅 ${fmt(t.start_date)} – ${fmt(t.end_date, {year:true})}</span>
          <span>👥 ${t.travelers}</span>
          ${t.budget_total ? `<span>💰 ${t.budget_currency} ${Number(t.budget_total).toLocaleString()}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('')
}

// ── TRIP DETAIL ────────────────────────────────────────────────────────────
async function loadTrip(id) {
  show('viewDetail')
  document.getElementById('backBtn').style.display = ''
  document.getElementById('newTripBtn').style.display = ''
  document.getElementById('heroArea').innerHTML = '<div class="loading">Loading…</div>'
  document.getElementById('itinArea').innerHTML = ''
  document.getElementById('statsRow').innerHTML = ''
  document.getElementById('notesArea').innerHTML = ''

  const [{ data: trip }, { data: days }] = await Promise.all([
    sb.from('trips').select('*').eq('id', id).single(),
    sb.from('itinerary_days').select('*, activities(*)').eq('trip_id', id).order('day_index')
  ])

  if (!trip) { document.getElementById('heroArea').innerHTML = '<p style="color:var(--bad);padding:40px">Trip not found.</p>'; return }

  const dayCount = Math.ceil((new Date(trip.end_date) - new Date(trip.start_date)) / 86400000) + 1
  const actCount = (days||[]).reduce((s,d) => s + (d.activities?.length||0), 0)

  // Hero
  document.getElementById('heroArea').innerHTML = `
    <div class="hero" style="${trip.cover_url ? `background-image:url(${trip.cover_url})` : ''}">
      <div class="hero-overlay"></div>
      <div class="hero-content fade">
        <h1 class="hero-title">${trip.name}</h1>
        ${trip.subtitle ? `<p class="hero-sub">${trip.subtitle}</p>` : ''}
        <div class="hero-meta">
          <span class="dest">📍 ${trip.destination}</span>
          <span>📅 ${fmt(trip.start_date)} – ${fmt(trip.end_date, {year:true})}</span>
          <span>👥 ${trip.travelers} traveler${trip.travelers!==1?'s':''}</span>
          ${trip.budget_total ? `<span>💰 ${trip.budget_currency} ${Number(trip.budget_total).toLocaleString()}</span>` : ''}
        </div>
      </div>
    </div>`

  // Stats
  document.getElementById('statsRow').innerHTML = [
    {label:'Days', value: dayCount},
    {label:'Activities', value: actCount},
    {label:'Status', value: trip.status.charAt(0).toUpperCase()+trip.status.slice(1)},
  ].map(s=>`<div class="stat fade"><div class="stat-label">${s.label}</div><div class="stat-value">${s.value}</div></div>`).join('')

  // Notes
  if (trip.notes) {
    document.getElementById('notesArea').innerHTML = `
      <div class="notes-box fade"><div class="notes-label">Notes</div><div class="notes-text">${trip.notes}</div></div>`
  }

  // Itinerary
  const itin = document.getElementById('itinArea')
  if (!days?.length) { itin.innerHTML = '<p style="color:var(--muted)">No itinerary days added yet.</p>'; return }

  itin.innerHTML = days.map(day => {
    const acts = (day.activities||[]).sort((a,b)=>a.position-b.position)
    return `
      <div class="fade">
        <div class="day-header">
          <div class="day-num">${day.day_index}</div>
          <div class="day-info">
            <p>${day.title||`Day ${day.day_index}`}</p>
            <span>${fmt(day.date, {weekday:true})}${day.weather?` · ${day.weather.t}`:''}</span>
          </div>
        </div>
        <div class="acts">
          ${acts.map(act=>`
            <div class="act">
              <div class="act-icon">${icon(act.icon)}</div>
              <div class="act-body">
                <div class="act-top">
                  <span class="act-title">${act.title}</span>
                  ${act.time?`<span class="act-time">${act.time}</span>`:''}
                </div>
                ${act.subtitle?`<div class="act-sub">${act.subtitle}</div>`:''}
                ${act.brief?`<div class="act-brief">${act.brief}</div>`:''}
                <div class="act-foot">
                  ${act.location?`<span class="act-loc">📍 ${act.location}</span>`:''}
                  ${act.transport?`<span class="act-loc">🚇 ${act.transport}</span>`:''}
                  ${(act.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}
                </div>
              </div>
            </div>`).join('')}
        </div>
      </div>`
  }).join('')
}

// ── CREATE TRIP ────────────────────────────────────────────────────────────
async function createTrip() {
  const btn = document.getElementById('submitBtn')
  const err = document.getElementById('formErr')
  const name = document.getElementById('fName').value.trim()
  const dest = document.getElementById('fDest').value.trim()
  const start = document.getElementById('fStart').value
  const end = document.getElementById('fEnd').value

  err.textContent = ''
  if (!name) { err.textContent = 'Trip name is required.'; return }
  if (!dest) { err.textContent = 'Destination is required.'; return }
  if (!start || !end) { err.textContent = 'Start and end dates are required.'; return }
  if (new Date(end) < new Date(start)) { err.textContent = 'End date must be after start date.'; return }

  btn.disabled = true; btn.textContent = 'Creating…'

  const { data, error } = await sb.from('trips').insert({
    user_id: '00000000-0000-0000-0000-000000000000',
    name,
    subtitle: document.getElementById('fSub').value.trim() || null,
    destination: dest,
    start_date: start,
    end_date: end,
    status: document.getElementById('fStatus').value,
    budget_total: parseFloat(document.getElementById('fBudget').value) || null,
    budget_currency: document.getElementById('fCurrency').value || 'USD',
    travelers: parseInt(document.getElementById('fTravelers').value) || 1,
    notes: document.getElementById('fNotes').value.trim() || null,
    cover_url: document.getElementById('fCover').value.trim() || null,
  }).select().single()

  btn.disabled = false; btn.textContent = 'Create Trip'

  if (error) { err.textContent = error.message; return }

  // Reset form
  ['fName','fSub','fDest','fStart','fEnd','fBudget','fNotes','fCover'].forEach(id => document.getElementById(id).value = '')
  document.getElementById('fTravelers').value = 1
  document.getElementById('fStatus').value = 'draft'
  document.getElementById('fCurrency').value = 'USD'

  loadTrip(data.id)
}

// Boot
loadTrips()
</script>
</body>
</html>
